<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>星眠る街の脱出 | Whispers of R'lyeh</title>
<style>
:root {
  color-scheme: dark;
}

html, body {
  height: 100%;
  margin: 0;
  background: #02050a;
  color: #d9e7f2;
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", "Segoe UI", Arial, sans-serif;
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

button {
  font: inherit;
  color: inherit;
  background: rgba(9, 21, 29, .78);
  border: 1px solid rgba(100, 160, 190, .32);
  border-radius: .35em;
  padding: .35em .6em;
  cursor: pointer;
  box-shadow: 0 .1em .45em rgba(0, 0, 0, .22);
}

button:hover,
button:focus {
  background: rgba(15, 35, 48, .92);
  border-color: rgba(120, 220, 255, .65);
  outline: none;
}

button:disabled {
  opacity: .35;
  cursor: not-allowed;
}

#rotate {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  background: #02050a;
  text-align: center;
  padding: 1.2rem;
}

.rotateBox {
  max-width: 30rem;
  border: 1px solid rgba(100, 160, 190, .3);
  background: rgba(8, 17, 24, .9);
  border-radius: 1rem;
  padding: 2rem;
}

.rotateIcon {
  font-size: 4rem;
  margin-bottom: .7rem;
  color: #7ad7e8;
}

.rotateBox h2 {
  margin: 0 0 .7rem;
  color: #b8e7df;
}

.rotateBox p {
  margin: 0;
  opacity: .85;
}

@media (orientation: portrait) {
  #rotate {
    display: flex;
  }
  #gameWrap {
    display: none;
  }
}

#gameWrap {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #02050a;
}

#game {
  position: relative;
  overflow: hidden;
  width: min(100vw, calc(100vh * 16 / 9));
  height: min(100vh, calc(100vw * 9 / 16));
  background: #04070d;
  font-size: clamp(9px, 1.35vw, 18px);
  user-select: none;
}

.view {
  display: none;
  position: absolute;
  inset: 0;
}

.view.active {
  display: block;
}

.overlay {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}

#endingScreen {
  z-index: 110;
}

.overlay.active {
  display: flex;
}

#titleScreen,
#endingScreen {
  background:
    radial-gradient(circle at 50% 65%, rgba(16, 43, 64, .52), rgba(2, 5, 10, .97) 65%),
    #02050a;
}

.titleBox {
  width: min(92%, 52em);
  max-height: 100%;
  overflow: auto;
  text-align: center;
  padding: 1rem;
}

.mythos {
  margin: 0 0 .5rem;
  color: #75a0b5;
  letter-spacing: .22em;
  font-size: .8em;
}

.titleBox h1 {
  margin: 0 0 .6rem;
  font-size: 2.35em;
  line-height: 1.15;
  color: #d8c89a;
  text-shadow: 0 0 1.5em rgba(90, 180, 210, .22);
  letter-spacing: .04em;
}

.sub,
.note {
  margin: 0 0 1rem;
  opacity: .82;
  line-height: 1.5;
}

.note {
  font-size: .8em;
  opacity: .55;
}

.body {
  white-space: pre-line;
  line-height: 1.6;
  text-align: left;
}

.titleButtons {
  display: flex;
  flex-wrap: wrap;
  gap: .5em;
  justify-content: center;
  margin-top: 1.4em;
}

.titleButtons button {
  min-width: 8em;
  font-size: 1.1em;
  padding: .7em 1em;
}

.titleSettings {
  display: flex;
  flex-wrap: wrap;
  gap: .4em;
  justify-content: center;
  margin-top: 1em;
}

#topbar {
  position: absolute;
  top: .35em;
  right: .35em;
  z-index: 30;
  display: flex;
  flex-wrap: wrap;
  gap: .25em;
  justify-content: flex-end;
}

#topbar button {
  font-size: .72em;
  padding: .28em .45em;
}

#sceneWrap {
  position: absolute;
  inset: 0;
}

#scene {
  width: 100%;
  height: 100%;
  display: block;
}

.hidden {
  display: none !important;
}

.hotspot {
  cursor: pointer;
}

.hotspot:hover,
.hotspot:focus {
  filter: drop-shadow(0 0 4px rgba(100, 230, 255, .55));
}

#bottomUI {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  min-height: 16%;
  max-height: 30%;
  display: flex;
  gap: .4em;
  padding: .45em;
  pointer-events: none;
  z-index: 40;
}

#messageBox {
  flex: 1;
  min-height: 3em;
  padding: .65em .7em;
  border-radius: .45em;
  background: linear-gradient(to top, rgba(2, 8, 12, .96), rgba(2, 8, 12, 0) 95%);
  font-size: 1.05em;
  line-height: 1.45;
  white-space: pre-line;
  pointer-events: none;
}

#inventory {
  width: 30%;
  min-width: 7em;
  display: flex;
  flex-wrap: wrap;
  gap: .3em;
  align-items: flex-end;
  justify-content: flex-end;
  pointer-events: auto;
}

.invEmpty {
  color: rgba(180, 220, 235, .35);
  font-size: .9em;
  padding: .35em;
  pointer-events: none;
}

.inv-item {
  font-size: .85em;
  padding: .35em .5em;
}

.modal {
  position: absolute;
  inset: 0;
  z-index: 500;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(1, 5, 8, .82);
  padding: 1em;
}

.modal.show {
  display: flex;
}

.panel {
  width: min(92%, 48em);
  max-height: 90%;
  overflow: auto;
  background: #08131a;
  border: 1px solid rgba(120, 200, 230, .26);
  border-radius: .7em;
  padding: 1.1em;
  box-shadow: 0 0 3em rgba(0, 0, 0, .65);
}

.panel h3 {
  margin: 0 0 .9em;
  color: #9ad9d2;
}

.row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: .5em;
  margin-top: 1em;
}

.dials {
  display: flex;
  justify-content: center;
  gap: 1em;
  margin: 1em 0;
}

.dial {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .3em;
}

.digit {
  width: 2.1em;
  text-align: center;
  font-size: 2.4em;
  border: 1px solid rgba(150, 220, 240, .38);
  background: #020a0e;
  color: #d2ecf7;
  border-radius: .25em;
  padding: .15em;
}

.dial button {
  font-size: 1.15em;
  min-width: 2.1em;
}

.lock-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: .5em;
}

#cabinet-lock.used {
  fill: #7a7054;
}

#desk-dial.unlocked {
  fill: #6f7d72;
}

#door-socket.filled {
  fill: #d9c58f;
  stroke: #ffe4a0;
  filter: drop-shadow(0 0 8px rgba(255, 216, 118, .65));
}

#hot-rug.moved ellipse {
  opacity: .82;
}
</style>
</head>

    inspectBrassKey: "A brass key whose teeth are shaped like a star.",

    msgIntro: "This is an old ship-keeper's room.\nThe door is sealed with a star-shaped socket.\nTo escape, you must follow the key that calls the sleeping city.",

    hint1: "Hint 1: Search the whole room. The silver key is under the rug, and it opens the bookshelf box.",

const ITEM_META = {
  silver: { name: "itemSilverKey", inspect: "inspectSilverKey" },
  codex: { name: "itemCodex", inspect: "inspectCodex" },
  brass: { name: "itemBrassKey", inspect: "inspectBrassKey" },
  amulet: { name: "itemAmulet", inspect: "inspectAmulet" }
};

const OBJ_MAP = {
  window: "objWindow",
  chart: "objChart",
  shelf: "objShelf",
  rug: "objRug",
  desk: "objDesk",
  cabinet: "objCabinet",
  door: "objDoor"
};

let settings = { lang: "ja", sound: true };
let game = newGame();
let lastMessage = { key: null };
let lastTextModal = { titleKey: null, bodyKey: null };
let currentDigits = [0, 0, 0];
let audioCtx = null;

function newGame() {
  return {
    hasSilverKey: false,
    hasCodex: false,
    deskUnlocked: false,
    hasBrassKey: false,
    cabinetOpened: false,
    hasAmulet: false,
    escaped: false,
    hintIndex: 0
  };
}

function lsGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}

function lsSet(key, value) {
  try { localStorage.setItem(key, value); } catch (e) {}
}

function lsDel(key) {
  try { localStorage.removeItem(key); } catch (e) {}
}

function loadSettings() {
  const raw = lsGet(SETTINGS_KEY);
  if (raw) {
    try {
      const d = JSON.parse(raw);
      if (d && (d.lang === "ja" || d.lang === "en")) settings.lang = d.lang;
      if (typeof d.sound === "boolean") settings.sound = d.sound;
    } catch (e) {}
  } else {
    const l = (navigator.language || "en").toLowerCase();
    settings.lang = l.startsWith("ja") ? "ja" : "en";
  }
}

function saveSettings() {
  lsSet(SETTINGS_KEY, JSON.stringify(settings));
}

function saveProgress() {
  if (game.escaped) {
    lsDel(SAVE_KEY);
    return;
  }
  lsSet(SAVE_KEY, JSON.stringify(game));
}

function clearProgress() {
  lsDel(SAVE_KEY);
}

function getSaveData() {
  const raw = lsGet(SAVE_KEY);
  if (!raw) return null;
  try {
    const d = JSON.parse(raw);
    if (!d || d.escaped) return null;
    return d;
  } catch (e) {
    return null;
  }
}

function loadProgress() {
  const d = getSaveData();
  if (!d) return false;

  const clean = newGame();
  for (const k in clean) {
    if (!Object.prototype.hasOwnProperty.call(clean, k)) continue;
    if (!Object.prototype.hasOwnProperty.call(d, k)) continue;
    const v = d[k];
    if (k === "hintIndex") {
      const n = Number(v);
      clean[k] = Number.isFinite(n) ? Math.max(0, Math.min(3, Math.floor(n))) : 0;
    } else {
      clean[k] = Boolean(v);
    }
  }
  game = clean;
  saveProgress();
  return true;
}

function t(key) {
  const d = I18N[settings.lang] || I18N.en;
  return d[key] || I18N.en[key] || key;
}

function setKey(id, key) {
  const el = document.getElementById(id);
  if (el) el.textContent = t(key);
}

function ensureAudio() {
  if (!settings.sound) return null;
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  } catch (e) {
    return null;
  }
}

function beep(freq, dur, type, vol, when) {
  const ctx = ensureAudio();
  if (!ctx) return;

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const t0 = ctx.currentTime + (when || 0);

  osc.type = type || "sine";
  osc.frequency.setValueAtTime(freq, t0);

  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol || 0.05, t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.05);
}

function playSound(kind) {
  if (!settings.sound) return;

  switch (kind) {
    case "click":
      beep(340, 0.06, "triangle", 0.035);
      break;
    case "error":
      beep(120, 0.18, "sawtooth", 0.055);
      beep(88, 0.30, "sine", 0.045, 0.08);
      break;
    case "take":
      beep(520, 0.09, "triangle", 0.045);
      beep(780, 0.10, "sine", 0.045, 0.07);
      break;
    case "success":
      beep(620, 0.12, "sine", 0.045);
      beep(880, 0.16, "triangle", 0.05, 0.11);
      break;
    case "end":
      beep(110, 2.0, "sine", 0.065);
      beep(165, 1.8, "triangle", 0.035, 0.18);
      beep(82, 2.6, "sawtooth", 0.025, 0.35);
      break;
  }
}

function say(key) {
  lastMessage = { key };
  renderMessage();
}

function renderMessage() {
  const box = document.getElementById("messageBox");
  if (!box) return;
  box.textContent = lastMessage.key ? t(lastMessage.key) : "";
}

function applyI18n() {
  document.documentElement.lang = settings.lang;
  document.title = t("title") + " | Cthulhu Escape";

  setKey("rotateTitle", "rotateTitle");
  setKey("rotateText", "rotateText");

  setKey("gameTitle", "title");
  setKey("gameSubtitle", "subtitle");
  setKey("autoSavedNote", "autoSavedNote");
  setKey("btnStart", "startNew");
  setKey("btnContinue", "continue");
  setKey("btnHelpTitle", "how");

  const soundKey = settings.sound ? "soundOn" : "soundOff";
  setKey("btnSoundTitle", soundKey);
  setKey("btnSound", soundKey);

  const langKey = settings.lang === "ja" ? "langToEn" : "langToJa";
  setKey("btnLangTitle", langKey);
  setKey("btnLang", langKey);

  setKey("btnHint", "hint");
  setKey("btnMenu", "menu");

  setKey("lockTitle", "lockTitle");
  setKey("btnCheck", "check");
  setKey("btnCloseLock", "close");
  setKey("textModalClose", "close");

  setKey("endTitle", "endTitle");
  setKey("endBody", "endBody");
  setKey("btnAgain", "startNew");
  setKey("btnEndTitle", "menu");

  renderMessage();
  updateInventory();
  updateHotspotAria();

  const tm = document.getElementById("textModal");
  if (tm && tm.classList.contains("show") && lastTextModal.titleKey) {
    setKey("textModalTitle", lastTextModal.titleKey);
    setKey("textModalBody", lastTextModal.bodyKey);
  }

  const lm = document.getElementById("lockModal");
  if (lm && lm.classList.contains("show")) renderLock();
}

function showScreen(which) {
  const map = {
    title: "titleScreen",
    game: "gameScreen",
    ending: "endingScreen"
  };
  ["titleScreen", "gameScreen", "endingScreen"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.toggle("active", id === map[which]);
  });
}

function updateTitleButtons() {
  const has = !!getSaveData();
  const b = document.getElementById("btnContinue");
  if (b) b.disabled = !has;
}

function startNew(force) {
  if (!force && getSaveData()) {
    if (!window.confirm(t("confirmNew"))) return;
  }

  game = newGame();
  clearProgress();
  saveProgress();

  showScreen("game");
  say("msgIntro");
  updateAll();
  playSound("success");
}

function continueGame() {
  if (!loadProgress()) {
    updateTitleButtons();
    return;
  }
  showScreen("game");
  say("msgContinue");
  updateAll();
  playSound("take");
}

function goToTitle() {
  saveProgress();
  showScreen("title");
  updateTitleButtons();
  playSound("click");
}

function updateAll() {
  updateInventory();
  updateSceneVisuals();
  updateHotspotAria();
  updateTitleButtons();
}

function updateInventory() {
  const inv = document.getElementById("inventory");
  if (!inv) return;
  inv.innerHTML = "";

  const items = [];
  if (game.hasSilverKey) items.push("silver");
  if (game.hasCodex) items.push("codex");
  if (game.hasBrassKey) items.push("brass");
  if (game.hasAmulet) items.push("amulet");

  if (!items.length) {
    const span = document.createElement("div");
    span.className = "invEmpty";
    span.textContent = t("inventoryEmpty");
    inv.appendChild(span);
    return;
  }

  items.forEach(id => {
    const meta = ITEM_META[id];
    const btn = document.createElement("button");
    btn.className = "inv-item";
    btn.textContent = t(meta.name);
    btn.setAttribute("aria-label", t(meta.name));
    btn.addEventListener("click", () => {
      if (id === "codex") {
        openTextModal("codexTitle", "codexBody");
      } else {
        playSound("click");
        say(meta.inspect);
      }
    });
    inv.appendChild(btn);
  });
}

function updateSceneVisuals() {
  const codex = document.getElementById("item-codex");
  if (codex) codex.classList.toggle("hidden", game.hasCodex);

  const cabLock = document.getElementById("cabinet-lock");
  if (cabLock) cabLock.classList.toggle("used", game.cabinetOpened);

  const deskDial = document.getElementById("desk-dial");
  if (deskDial) deskDial.classList.toggle("unlocked", game.deskUnlocked);

  const socket = document.getElementById("door-socket");
  if (socket) socket.classList.toggle("filled", game.hasAmulet);

  const rug = document.getElementById("hot-rug");
  if (rug) rug.classList.toggle("moved", game.hasSilverKey);
}

function updateHotspotAria() {
  document.querySelectorAll(".hotspot").forEach(g => {
    const key = OBJ_MAP[g.dataset.id];
    if (key) g.setAttribute("aria-label", t(key));
  });
}

function onSceneClick(e) {
  const g = e.target.closest(".hotspot");
  if (!g) return;
  const id = g.dataset.id;
  if (!id) return;
  playSound("click");
  handleAction(id);
}

function onSceneKey(e) {
  if (e.key !== "Enter" && e.key !== " ") return;
  const g = e.target.closest(".hotspot");
  if (!g) return;
  const id = g.dataset.id;
  if (!id) return;
  e.preventDefault();
  playSound("click");
  handleAction(id);
}

function handleAction(id) {
  let changed = false;

  switch (id) {
    case "window":
      if (game.hasAmulet) say("msgWindowAmulet");
      else say("msgWindow");
      break;

    case "chart":
      say("msgChart");
      break;

    case "rug":
      if (!game.hasSilverKey) {
        game.hasSilverKey = true;
        changed = true;
        say("msgGetSilverKey");
        playSound("take");
      } else {
        say("msgRugEmpty");
      }
      break;

    case "shelf":
      if (!game.hasCodex) {
        if (game.hasSilverKey) {
          game.hasCodex = true;
          changed = true;
          say("msgGetCodex");
          playSound("take");
        } else {
          say("msgShelfLocked");
          playSound("error");
        }
      } else {
        say("msgShelfEmpty");
      }
      break;

    case "desk":
      if (game.deskUnlocked) {
        say("msgDeskEmpty");
      } else {
        currentDigits = [0, 0, 0];
        renderLock();
        openLockModal();
        say("msgOpenDesk");
      }
      break;

    case "cabinet":
      if (game.cabinetOpened) {
        say("msgCabinetEmpty");
      } else if (game.hasBrassKey) {
        game.cabinetOpened = true;
        game.hasAmulet = true;
        changed = true;
        say("msgGetAmulet");
        playSound("success");
      } else {
        say("msgCabinetLocked");
        playSound("error");
      }
      break;

    case "door":
      if (game.hasAmulet) {
        finish();
        return;
      } else {
        say("msgDoorLocked");
        playSound("error");
      }
      break;

    default:
      break;
  }

  if (changed) {
    saveProgress();
    updateAll();
  }
}

function openLockModal() {
  const m = document.getElementById("lockModal");
  if (m) m.classList.add("show");
}

function closeLockModal() {
  const m = document.getElementById("lockModal");
  if (m) m.classList.remove("show");
}

function renderLock() {
  for (let i = 0; i < 3; i++) {
    const el = document.getElementById("digit" + i);
    if (el) el.textContent = String(currentDigits[i]);
  }
}

function onLockClick(e) {
  if (e.target.id === "lockModal") {
    closeLockModal();
    return;
  }

  const btn = e.target.closest("button");
  if (!btn) return;

  if (btn.id === "btnCheck") {
    checkLock();
  } else if (btn.id === "btnCloseLock") {
    closeLockModal();
  } else if (btn.hasAttribute("data-delta")) {
    const idx = Number(btn.dataset.digit);
    const delta = Number(btn.dataset.delta);
    if (Number.isFinite(idx)) {
      currentDigits[idx] = (currentDigits[idx] + delta + 10) % 10;
      renderLock();
      playSound("click");
    }
  }
}

function checkLock() {
  const ok = currentDigits.every((v, i) => v === CODE[i]);
  if (!ok) {
    playSound("error");
    say("msgCodeWrong");
    return;
  }

  game.deskUnlocked = true;
  game.hasBrassKey = true;
  closeLockModal();
  say("msgUnlockDesk");
  playSound("success");
  saveProgress();
  updateAll();
}

function openTextModal(titleKey, bodyKey) {
  lastTextModal = { titleKey, bodyKey };
  setKey("textModalTitle", titleKey);
  setKey("textModalBody", bodyKey);
  const m = document.getElementById("textModal");
  if (m) m.classList.add("show");
  playSound("click");
}

function closeTextModal() {
  const m = document.getElementById("textModal");
  if (m) m.classList.remove("show");
  lastTextModal = { titleKey: null, bodyKey: null };
}

function finish() {
  if (game.escaped) return;
  game.escaped = true;
  clearProgress();
  showScreen("ending");
  setKey("endTitle", "endTitle");
  setKey("endBody", "endBody");
  playSound("end");
}

function showHint() {
  if (game.hintIndex < 3) game.hintIndex++;
  const n = Math.max(1, Math.min(3, game.hintIndex));
  say("hint" + n);
  playSound("click");
  saveProgress();
}

function toggleLang() {
  settings.lang = settings.lang === "ja" ? "en" : "ja";
  saveSettings();
  applyI18n();
  playSound("click");
}

function toggleSound() {
  settings.sound = !settings.sound;
  saveSettings();
  applyI18n();
  if (settings.sound) playSound("click");
}

function bindEvents() {
  document.getElementById("btnStart").addEventListener("click", () => startNew(false));
  document.getElementById("btnContinue").addEventListener("click", continueGame);
  document.getElementById("btnHelpTitle").addEventListener("click", () => openTextModal("howTitle", "howBody"));
  document.getElementById("btnSoundTitle").addEventListener("click", toggleSound);
  document.getElementById("btnLangTitle").addEventListener("click", toggleLang);

  document.getElementById("btnSound").addEventListener("click", toggleSound);
  document.getElementById("btnLang").addEventListener("click", toggleLang);
  document.getElementById("btnHint").addEventListener("click", showHint);
  document.getElementById("btnMenu").addEventListener("click", goToTitle);

  document.getElementById("btnAgain").addEventListener("click", () => startNew(true));
  document.getElementById("btnEndTitle").addEventListener("click", goToTitle);

  const scene = document.getElementById("scene");
  scene.addEventListener("click", onSceneClick);
  scene.addEventListener("keydown", onSceneKey);

  document.getElementById("lockModal").addEventListener("click", onLockClick);
  document.getElementById("textModal").addEventListener("click", e => {
    if (e.target.id === "textModal") closeTextModal();
  });
  document.getElementById("textModalClose").addEventListener("click", closeTextModal);

  document.getElementById("game").addEventListener("contextmenu", e => e.preventDefault());
}

function init() {
  loadSettings();
  bindEvents();
  applyI18n();
  showScreen("title");
  updateTitleButtons();
}

init();
</script>
